<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários — SecurityAI</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .users-grid { display:grid; gap:12px; margin-top:1rem; }
        .user-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1rem 1.2rem; display:flex; align-items:center; gap:1rem; }
        .user-card .user-info { flex:1; }
        .user-card .user-info h3 { margin:0; font-size:.95rem; color:var(--text); }
        .user-card .user-info p { margin:2px 0 0; font-size:.8rem; color:var(--text-secondary); }
        .user-card .actions { display:flex; gap:6px; }
        .badge-role { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.7rem; font-weight:600; text-transform:uppercase; }
        .badge-admin { background:var(--danger); color:#fff; }
        .badge-chefe { background:var(--warn); color:#000; }
        .badge-vigilante { background:var(--primary); color:#fff; }
        .badge-viewer { background:var(--info); color:#fff; }
        .form-row { display:flex; gap:1rem; align-items:end; flex-wrap:wrap; }
        .form-row > div { flex:1; min-width:180px; }
        .form-row label { display:block; margin-bottom:.3rem; font-size:.85rem; color:var(--text-secondary); }
        .form-row input, .form-row select { width:100%; padding:.55rem .7rem; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); box-sizing:border-box; }
    </style>
</head>
<body>
    <div class="main" style="margin-left:0; padding:1.5rem;">
        <h2 style="margin:0 0 1rem;">👥 Gestão de Usuários</h2>
        <div id="create-user-form" class="card" style="margin-bottom:1.5rem;">
            <h3 style="margin:0 0 .8rem;">Criar novo usuário</h3>
            <div class="form-row">
                <div>
                    <label for="new-username">Usuário</label>
                    <input type="text" id="new-username" placeholder="nome">
                </div>
                <div>
                    <label for="new-password">Senha</label>
                    <input type="password" id="new-password" placeholder="mínimo 6 caracteres">
                </div>
                <div>
                    <label for="new-role">Role</label>
                    <select id="new-role"></select>
                </div>
                <div>
                    <button type="button" class="button" id="btn-create-user" style="margin-top:22px;">Criar</button>
                </div>
            </div>
            <div id="create-error" class="form-message" style="color:var(--danger);display:none;"></div>
        </div>
        <div id="users-list" class="users-grid"></div>
    </div>
    <script>
    const ROLES = [
        {value:'admin', label:'Admin (Síndico)', badge:'badge-admin'},
        {value:'chefe_seguranca', label:'Chefe de Segurança', badge:'badge-chefe'},
        {value:'vigilante', label:'Vigilante', badge:'badge-vigilante'},
        {value:'viewer', label:'Morador (Viewer)', badge:'badge-viewer'},
    ];
    let currentUser = null;
    let users = [];

    async function init() {
        const meResp = await fetch('/api/auth/me');
        if (meResp.status === 401) { window.location.href = '/login'; return; }
        const me = await meResp.json();
        currentUser = me.user;
        // Populate role select based on permissions
        const roleSelect = document.getElementById('new-role');
        const canCreate = me.permissions?.create_users;
        ROLES.forEach(r => {
            // Admin can create all; chefe can create vigilante+viewer
            if (currentUser.role === 'admin' || (currentUser.role === 'chefe_seguranca' && r.value !== 'admin')) {
                const opt = document.createElement('option');
                opt.value = r.value; opt.textContent = r.label;
                roleSelect.appendChild(opt);
            }
        });
        if (!canCreate) {
            document.getElementById('create-user-form').style.display = 'none';
        }
        await loadUsers();
    }

    async function loadUsers() {
        const resp = await fetch('/api/users');
        users = await resp.json();
        render();
    }

    function render() {
        const container = document.getElementById('users-list');
        container.innerHTML = users.map(u => {
            const roleInfo = ROLES.find(r => r.value === u.role) || {label:u.role, badge:''};
            const isMe = u.id === currentUser.id;
            const isLastAdmin = u.role === 'admin' && users.filter(x => x.role === 'admin' && x.active).length <= 1;
            return `<div class="user-card">
                <div class="user-info">
                    <h3>${u.username} ${isMe ? '<span style="font-size:.75rem;color:var(--muted);">(você)</span>' : ''}</h3>
                    <p><span class="badge-role ${roleInfo.badge}">${roleInfo.label}</span> · ${u.active ? 'Ativo' : 'Inativo'} ·Criado em ${new Date(u.created_at).toLocaleDateString('pt-BR')}</p>
                </div>
                <div class="actions">
                    ${u.role === 'viewer' && !isMe ? `<button class="btn-sm" onclick="openCameras(${u.id}, '${u.username}')">Câmeras</button>` : ''}
                    ${!isMe && !isLastAdmin ? `<button class="btn-sm" onclick="toggleUser(${u.id}, ${u.active ? 0 : 1})">${u.active ? 'Desativar' : 'Ativar'}</button>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    async function toggleUser(id, active) {
        await fetch(`/api/users/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({active}),
        });
        await loadUsers();
    }

    document.getElementById('btn-create-user').addEventListener('click', async () => {
        const errEl = document.getElementById('create-error');
        errEl.style.display = 'none';
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value;
        const role = document.getElementById('new-role').value;
        if (!username || !password) { errEl.textContent = 'Preencha todos os campos'; errEl.style.display='block'; return; }
        if (password.length < 6) { errEl.textContent = 'Senha mínima: 6 caracteres'; errEl.style.display='block'; return; }
        const resp = await fetch('/api/users', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, role}),
        });
        const data = await resp.json();
        if (!resp.ok) { errEl.textContent = data.error || 'Erro'; errEl.style.display='block'; return; }
        document.getElementById('new-username').value = '';
        document.getElementById('new-password').value = '';
        await loadUsers();
    });

    // ── Camera assignment dialog ──
    let cameras = [];
    let editingUserId = null;

    async function openCameras(userId, username) {
        editingUserId = userId;
        document.getElementById('cam-dialog-title').textContent = `Câmeras de ${username}`;
        // Load all cameras
        const camResp = await fetch('/cameras');
        cameras = await camResp.json();
        // Load current assignments
        const assignResp = await fetch(`/api/users/${userId}/cameras`);
        const assigned = await assignResp.json();
        const assignedIds = new Set(assigned.camera_ids || []);
        // Render checkboxes
        const list = document.getElementById('cam-list');
        if (!cameras.length) {
            list.innerHTML = '<p style="color:var(--muted);">Nenhuma câmera cadastrada</p>';
        } else {
            list.innerHTML = cameras.map(c => 
                `<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.85rem;cursor:pointer;">
                    <input type="checkbox" class="cam-check" value="${c.id}" ${assignedIds.has(c.id) ? 'checked' : ''}>
                    <span>${c.name}</span>
                    <span style="color:var(--muted);font-size:.75rem;">${c.zone || ''}</span>
                </label>`
            ).join('');
        }
        document.getElementById('cam-dialog').classList.remove('hidden-panel');
    }

    function closeCamDialog() {
        document.getElementById('cam-dialog').classList.add('hidden-panel');
        editingUserId = null;
    }

    async function saveCameras() {
        if (!editingUserId) return;
        const checked = [...document.querySelectorAll('.cam-check:checked')].map(cb => parseInt(cb.value));
        await fetch(`/api/users/${editingUserId}/cameras`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({camera_ids: checked}),
        });
        closeCamDialog();
    }

    init();
    </script>

    <!-- Camera assignment dialog -->
    <div id="cam-dialog" class="dialog-overlay hidden-panel">
        <div class="dialog-card" style="max-width:450px;">
            <div class="panel-header">
                <h2 id="cam-dialog-title" style="font-size:.95rem;">Câmeras</h2>
                <button type="button" class="button-close" onclick="closeCamDialog()">×</button>
            </div>
            <p style="font-size:.8rem;color:var(--muted);margin:0 0 .8rem;">Selecione as câmeras que este usuário pode ver. Nenhuma selecionada = acesso irrestrito.</p>
            <div id="cam-list" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:.5rem;"></div>
            <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end;">
                <button type="button" class="button-secondary" onclick="closeCamDialog()">Cancelar</button>
                <button type="button" class="button" onclick="saveCameras()">Salvar</button>
            </div>
        </div>
    </div>
</body>
</html>
